# Fix: short audio hitches/stutters on Intel 12th Gen laptops (Alder Lake, SOF audio driver).
#
# PipeWire runs every output at the smallest buffer ("quantum") any playing app asks for.
# With the default minimum of 256 samples, one app requesting low latency (a browser, an
# Electron app, a game, a capture card passthrough) pulls every output, speakers and
# Bluetooth alike, down to ~5-10 ms buffers, and playback hitches now and then without any
# error in the logs. A minimum of 1024 samples (about 21 ms at 48 kHz) stops it.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and restart PipeWire:
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.properties = {
    default.clock.min-quantum = 1024
}
