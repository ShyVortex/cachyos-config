# Config Cleaned for NVIDIA Hybrid + Wayland #
legacy_layout=false
offset_y=1

# Exclude Wine/Proton background processes
blacklist=steamwebhelper,wineboot.exe,explorer.exe,conhost.exe,winedbg.exe,services.exe,Launcher.exe,RockstarService.exe,SocialClubHelper.exe,RockstarErrorHandler.exe

# Target NVIDIA RTX 3080 Ti directly
pci_dev=0000:01:00.0

# GPU / CPU Stats
gpu_stats
gpu_load_change
vram
gpu_temp
cpu_stats
cpu_load_change
cpu_temp
cpu_power
ram
fps
fps_color_change
frame_timing
battery

# Hotkeys & Logging
toggle_logging=Shift_L+F2
toggle_hud_position=Shift_R+F11
toggle_hud=Control_R+less
output_folder=/home/angelo/.local/share/goverlay

# FPS Limiter (MangoJuice Presets)
fps_limit_method=late
toggle_fps_limit=F1
fps_limit=120,60,40

# Presentation (Disabled to prevent Xwayland deadlocks)
vsync=-1
gl_vsync=-1

# Layout & Aesthetics
horizontal
horizontal_stretch=0
background_alpha=0.6
position=top-left
font_size_secondary=12
gpu_text=
gpu_color=2e9762
cpu_text=CPU
cpu_color=2e97cb
fps_value=30,60
fps_color=008000,ffff00,ff0000
gpu_load_value=50,90
gpu_load_color=ffffff,ffffff,ffffff
cpu_load_value=50,90
cpu_load_color=ffffff,ffffff,ffffff
background_color=000000
frametime_color=00ff00
vram_color=ad64c1
ram_color=c26693
wine_color=eb5b5b
engine_color=ffffff
text_color=ffffff
media_player_color=ffffff
network_color=e07b85
battery_color=00ff00
horizontal_separator_color=ffffff
media_player_format={title};{artist};{album}
